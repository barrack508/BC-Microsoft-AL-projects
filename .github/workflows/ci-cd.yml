name: BC AL Extension CI/CD

on:
  push:
    branches: 
        - main
  pull_request:
    branches: 
        - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Download AL Symbols
        shell: powershell
        run: |
          Write-Host "Symbols assumed present in .alpackages/"

      - name: Compile AL Extension
        shell: powershell
        run: |
          # Find alc.exe from VS Code AL extension
          $alcPath = Get-ChildItem "$env:USERPROFILE\.vscode\extensions\ms-dynamics-smb.al-*\bin\win32\alc.exe" |
                     Sort-Object FullName -Descending |
                     Select-Object -First 1

          if (-not $alcPath) {
            Write-Error "alc.exe not found."
            exit 1
          }

          Write-Host "Using alc.exe at: $($alcPath.FullName)"

          $app          = Get-Content "$env:GITHUB_WORKSPACE\app.json" | ConvertFrom-Json
          $outputDir    = "$env:GITHUB_WORKSPACE\output"
          $outputApp    = $outputDir + "\" + $app.publisher + "_" + $app.name + "_" + $app.version + ".app"
          $packagesPath = "C:\Users\user\OneDrive\Apps\ALProject1\.alpackages"

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          Write-Host "Symbols : $packagesPath"
          Write-Host "Project : $env:GITHUB_WORKSPACE"
          Write-Host "Output  : $outputApp"

          if (-not (Test-Path $packagesPath)) {
            Write-Error "alpackages not found at: $packagesPath - Run AL: Download Symbols in VS Code first."
            exit 1
          }

          & $alcPath.FullName `
            /project:"$env:GITHUB_WORKSPACE" `
            /packagecachepath:"$packagesPath" `
            /out:"$outputApp"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Compilation failed!"
            exit 1
          }

          Write-Host "Compilation successful!"
          Write-Host "Output file: $outputApp"

      - name: Run AL Tests
        shell: powershell
        run: |
          $testApp = "$env:GITHUB_WORKSPACE\output\ALProject1.test.app"
          if (Test-Path $testApp) {
            Write-Host "Running tests..."
          } else {
            Write-Host "No test app found, skipping tests"
          }

      - name: Publish to Cronus BC
        if: github.ref == 'refs/heads/main'
        shell: powershell
        env:
          BC_SERVER_INSTANCE: ${{ secrets.BC_SERVER_INSTANCE }}
          BC_TENANT: ${{ secrets.BC_TENANT }}
          BC_USERNAME: ${{ secrets.BC_USERNAME }}
          BC_PASSWORD: ${{ secrets.BC_PASSWORD }}
        run: |
          # Find NavAdminTool dynamically
          $navTool = (Get-ChildItem -Path "C:\" -Recurse -Filter "NavAdminTool.ps1" `
                      -ErrorAction SilentlyContinue `
                      | Select-Object -First 1).FullName

          if (-not $navTool) {
            Write-Error "NavAdminTool.ps1 not found. Check your BC installation."
            exit 1
          }

          Write-Host "Using NavAdminTool at: $navTool"
          Import-Module $navTool

          $appFile = "$env:GITHUB_WORKSPACE\output\ALProject1.app"

          # Unpublish old version if exists
          try {
            Unpublish-NAVApp -ServerInstance $env:BC_SERVER_INSTANCE `
              -Name "ALProject1" -Tenant $env:BC_TENANT
          } catch { Write-Host "No previous version to unpublish" }

          # Publish new version
          Publish-NAVApp -ServerInstance $env:BC_SERVER_INSTANCE `
            -Path $appFile -SkipVerification

          # Sync schema
          Sync-NAVApp -ServerInstance $env:BC_SERVER_INSTANCE `
            -Name "ALProject1" -Tenant $env:BC_TENANT

          # Install
          Install-NAVApp -ServerInstance $env:BC_SERVER_INSTANCE `
            -Name "ALProject1" -Tenant $env:BC_TENANT

          Write-Host " Extension deployed to Cronus!"

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc-extension-app
          path: output/*.app