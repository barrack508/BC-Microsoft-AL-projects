name: BC AL Extension CI/CD

on:
  push:
    branches: 
        - main
  pull_request:
    branches: 
        - main

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Bump app version
        shell: powershell
        run: |
          $appJsonPath = "$env:GITHUB_WORKSPACE\app.json"
          $app = Get-Content $appJsonPath -Raw | ConvertFrom-Json

          $versionParts    = $app.version -split '\.'
          $versionParts[3] = "${{ github.run_number }}"
          $newVersion      = $versionParts -join '.'
          $app.version     = $newVersion
          $app | ConvertTo-Json -Depth 10 | Set-Content $appJsonPath

          Write-Host "Version bumped to: $newVersion"

      - name: Download AL Symbols
        shell: powershell
        run: |
          Write-Host "Symbols assumed present in .alpackages/"

      - name: Compile AL Extension
        shell: powershell
        run: |
          $alcPath = Get-ChildItem "$env:USERPROFILE\.vscode\extensions\ms-dynamics-smb.al-*\bin\win32\alc.exe" |
                     Sort-Object FullName -Descending |
                     Select-Object -First 1

          if (-not $alcPath) {
            Write-Error "alc.exe not found."
            exit 1
          }

          Write-Host "Using alc.exe at: $($alcPath.FullName)"

          $app          = Get-Content "$env:GITHUB_WORKSPACE\app.json" | ConvertFrom-Json
          $outputDir    = "$env:GITHUB_WORKSPACE\output"
          $outputApp    = $outputDir + "\" + $app.publisher + "_" + $app.name + "_" + $app.version + ".app"
          $packagesPath = "C:\Users\user\OneDrive\Apps\ALProject1\.alpackages"

          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null

          Write-Host "Symbols : $packagesPath"
          Write-Host "Project : $env:GITHUB_WORKSPACE"
          Write-Host "Output  : $outputApp"

          if (-not (Test-Path $packagesPath)) {
            Write-Error "alpackages not found at: $packagesPath - Run AL: Download Symbols in VS Code first."
            exit 1
          }

          & $alcPath.FullName `
            /project:"$env:GITHUB_WORKSPACE" `
            /packagecachepath:"$packagesPath" `
            /out:"$outputApp"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Compilation failed!"
            exit 1
          }

          Write-Host "Compilation successful!"
          Write-Host "Output file: $outputApp"

      - name: Run AL Tests
        shell: powershell
        run: |
          $testApp = "$env:GITHUB_WORKSPACE\output\ALProject1.test.app"
          if (Test-Path $testApp) {
            Write-Host "Running tests..."
          } else {
            Write-Host "No test app found, skipping tests"
          }

      - name: Publish to local BC container
        shell: powershell
        run: |
          Import-Module BcContainerHelper -ErrorAction Stop

          $app       = Get-Content "$env:GITHUB_WORKSPACE\app.json" | ConvertFrom-Json
          $outputApp = "$env:GITHUB_WORKSPACE\output\" + $app.publisher + "_" + $app.name + "_" + $app.version + ".app"

          if (-not (Test-Path $outputApp)) {
            Write-Error "App file not found at: $outputApp"
            exit 1
          }

          $securePassword = ConvertTo-SecureString "${{ secrets.BC_PASSWORD }}" -AsPlainText -Force
          $credential     = New-Object System.Management.Automation.PSCredential("${{ secrets.BC_USERNAME }}", $securePassword)

          Write-Host "Publishing $outputApp to container 'bcserver'..."

          Publish-BcContainerApp `
            -containerName "bcserver" `
            -appFile $outputApp `
            -credential $credential `
            -skipVerification `
            -sync `
            -syncMode Add `
            -install `
            -useDevEndpoint:$false

          Write-Host "Publish complete."

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: bc-extension-app
          path: output/*.app